filters:
  selection_mode: "category_round_robin"
  rotation_state_file: "data/account8/category_rotation.json"
  min_price: 2950        # 2026-07-31: 人間検査済みカテゴリ運用の一律下限
  max_price: 0
  sort_order: "review_desc"   # 各カテゴリ内を評価数順にし、最上位1商品を採用
  max_total_items: 10    # ver3.1: 10件体制（2026-07-19運用裁定・34→8→10 同日再裁定）
  max_per_category: 1    # ver4.2: 1棚1粒＝各カテゴリの顔役だけ（2026-07-24運用裁定・セール版へ戻す時は2）
  exclude_title_patterns:   # ver3.0: セット・複数個口・詰め合わせの除外（2026-07-19運用裁定）
    - 'セット'
    - 'まとめ買い'
    - 'まとめ売り'
    - '詰め合わせ'
    - 'アソート'
    - '福袋'
    - '(?<!\d)×\s?[2-9](?!\d)'

exclusion:
  posted_asins_file: "data/account8/asin_history.json"
  exclude_within_days: 20  # 投稿・予約成功ASINを20日間除外。履歴は予約ランナーから自動同期
  exclude_scraped_candidates: false   # 浚っただけの候補は焼かず、投稿・予約成功分のみ20日出禁
  exclude_product_identifiers: true  # GTIN系・ブランド＋正規化メーカー型番も完全一致で自動除外
  blocked_asins: []        # 恒久除外（ver2.8構造）
