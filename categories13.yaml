filters:
  selection_mode: "global_ranked"  # 全カテゴリ横断でsale_first順に採用
  rotation_state_file: "data/account13/category_rotation.json"  # 既存パスを保持。global_rankedでは未使用
  min_price: 3000
  max_price: 0
  sort_order: "sale_first"   # セール優先→割引率→価格の降順
  max_total_items: 10
  max_per_category: 2    # 同カテゴリ2件までを優先し、10件未満なら上限を超えて補充
  exclude_title_patterns:
    - 'セット'
    - 'まとめ買い'
    - 'まとめ売り'
    - '詰め合わせ'
    - 'アソート'
    - '福袋'
    - '(?<!\d)×\s?[2-9](?!\d)'

exclusion:
  posted_asins_file: "data/account13/asin_history.json"
  exclude_within_days: 20
  exclude_scraped_candidates: false
  exclude_product_identifiers: true
  blocked_asins: []
