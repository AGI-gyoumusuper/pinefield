filters:
  selection_policy_version: "profit_price_desc_v1"
  require_sale_info: true
  discount_contract: "amazon_direct_discounts_v1"
  verify_detail_offer: true
  offer_scope: "unified_discounts"
  deferred_retry_failed_searches: true  # 検索失敗カテゴリ（部分取得を含む）を新しいブラウザ文脈で一度だけ遅延再巡回する。
  selection_mode: "global_ranked"  # 全カテゴリ横断で販売価格の高い順に採用
  rotation_state_file: "data/account9/category_rotation.json"  # 既存パスを保持。global_rankedでは未使用
  min_price: 8000        # 2026-10-16: 販売価格の下限。棚別の高い下限は維持
  max_price: 0           # 上限なし
  sort_order: "price_desc"  # 本人指定: 検証済候補を販売価格の高い順
  max_total_items: 10    # ver3.1: 10件体制（2026-07-19運用裁定・34→8→10 同日再裁定）
  max_per_category: 0   # 棚別の優先枠を外し、価格順を維持
  exclude_title_patterns:   # ver3.0: セット・複数個口・詰め合わせの除外（2026-07-19運用裁定）
    - 'セット'
    - 'まとめ買い'
    - 'まとめ売り'
    - '詰め合わせ'
    - 'アソート'
    - '福袋'
    - '(?<!\d)×\s?[2-9](?!\d)'

exclusion:
  posted_asins_file: "data/account9/asin_history.json"
  exclude_within_days: 20  # 投稿・予約成功ASINを20日間除外。履歴は予約ランナーから自動同期
  exclude_scraped_candidates: false   # 浚っただけの候補は焼かず、投稿・予約成功分のみ20日出禁
  exclude_product_identifiers: true  # GTIN系・ブランド＋正規化メーカー型番も完全一致で自動除外
  blocked_asins: []        # 恒久除外（ver2.8構造）
