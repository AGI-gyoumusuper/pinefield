# account20 ゲームソフト Amazon正式カテゴリ設定
# 意図的な例外: 2カテゴリから各5商品を採用し、不足分は他方から補充して合計10商品とする。
# Amazon正式棚に含まれる本体・プリペイド番号・コントローラーも正常な候補として許容する。
categories:
  - name: "Nintendo Switch 2"
    url: "https://www.amazon.co.jp/s?rh=n%3A206233864051%2Cp_36%3A300000-%2Cp_n_deal_type%3A10343616051"
    max_items: 100
    is_search: true
  - name: "PS5ゲームソフト"
    url: "https://www.amazon.co.jp/s?rh=n%3A8019286051%2Cp_36%3A300000-%2Cp_n_deal_type%3A10343616051"
    max_items: 100
    is_search: true

filters:
  selection_policy_version: "profit_price_desc_v1"
  require_sale_info: true
  discount_contract: "amazon_direct_discounts_v1"
  verify_detail_offer: true  # 可視PDPでASIN・現価・参考価格・割引率を確定してから既存選定。
  offer_scope: "unified_discounts"  # 通常値下げ・Amazon内クーポンも同一経路で扱う。
  selection_mode: "category_quota"
  rotation_state_file: "data/account20/category_rotation.json"
  min_price: 8000        # 2026-10-16: 販売価格の下限。棚別の高い下限は維持
  max_price: 0           # 上限なし
  sort_order: "price_desc"  # 本人指定: 検証済候補を販売価格の高い順
  max_total_items: 10
  max_per_category: 5
  deferred_retry_failed_searches: true  # 検索失敗カテゴリ（部分取得を含む）を新しいブラウザ文脈で一度だけ遅延再巡回する。
  exclude_title_patterns:
    - 'セット'
    - 'まとめ買い'
    - 'まとめ売り'
    - '詰め合わせ'
    - 'アソート'
    - '福袋'
    - '(?<!\d)×\s?[2-9](?!\d)'

exclusion:
  posted_asins_file: "data/account20/asin_history.json"
  exclude_within_days: 20
  exclude_scraped_candidates: false
  exclude_product_identifiers: true
  blocked_asins: []

