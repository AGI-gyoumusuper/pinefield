filters:
  selection_mode: "global_ranked"  # 全カテゴリ横断でsale_first順に採用
  rotation_state_file: "data/account3/category_rotation.json"  # 既存パスを保持。global_rankedでは未使用
  min_price: 800         # 2026-09-10: 既存の800円下限を維持
  max_price: 0
  sort_order: "sale_first"   # セール優先→割引率→価格の降順
  max_total_items: 10    # ver3.1: 10件体制（2026-07-19運用裁定・34→8→10 同日再裁定）
  max_per_category: 2    # 同カテゴリ2件までを優先し、10件未満なら上限を超えて補充
  exclude_title_patterns:   # ver3.0: セット・複数個口・詰め合わせの除外（2026-07-19運用裁定）
    - 'セット'
    - 'まとめ買い'
    - 'まとめ売り'
    - '詰め合わせ'
    - 'アソート'
    - '福袋'
    - '(?<!\d)×\s?[2-9](?!\d)'

exclusion:
  posted_asins_file: "data/account3/asin_history.json"
  exclude_within_days: 20  # 投稿・予約成功ASINを20日間除外。履歴は予約ランナーから自動同期
  exclude_scraped_candidates: false   # 浚っただけの候補は焼かず、投稿・予約成功分のみ20日出禁
  exclude_product_identifiers: true  # GTIN系・ブランド＋正規化メーカー型番も完全一致で自動除外
  blocked_asins:
    - 'B07RHSYWHB'         # ver5.3: マッサージクッション棚へ誤登録されたクリスマス装飾を恒久除外
    - 'B07WQQ5VZZ'         # ver5.3: マッサージクッション棚へ誤登録された子供用ストローを恒久除外
    - 'B09FJ8VVC8'         # ver5.3: キャラクター画像のため現行サムネイル工程で生成不能、別商品へ差替え
