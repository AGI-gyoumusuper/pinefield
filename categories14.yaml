filters:
  deferred_retry_failed_searches: true  # Amazon拒否で0件になった検索カテゴリを新しい文脈で遅延再巡回する。
  selection_mode: "category_round_robin"
  rotation_state_file: "data/account14/category_rotation.json"
  min_price: 3000
  max_price: 0
  sort_order: "review_desc"
  max_total_items: 10
  max_per_category: 1
  # 単品・箱買いを許容し、異種商品の詰め合わせだけを除外する。
  exclude_title_patterns:
    - '詰め合わせ'
    - 'アソート'
    - '福袋'

exclusion:
  posted_asins_file: "data/account14/asin_history.json"
  exclude_within_days: 20
  exclude_scraped_candidates: false
  exclude_product_identifiers: true
  blocked_asins: []
