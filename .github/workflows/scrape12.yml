name: Scrape Amazon Products (account12)

on:
  push:
    branches:
      - main
    paths:
      - ".github/triggers/account12.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape_account12:
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[scrape:account12]')) || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure failure diagnostics
        continue-on-error: true
        run: |
          echo "PINEFIELD_FAILURE_ARTIFACTS_DIR=$RUNNER_TEMP/pinefield-failures" >> "$GITHUB_ENV"
          echo "PINEFIELD_SEARCH_DIAGNOSTICS_DIR=$RUNNER_TEMP/pinefield-failures/public-search" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve target date
        run: |
          TARGET_DATE=$(python scrape_target_date.py --account account12)
          echo "PINEFIELD_TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"
      - name: Install scraper dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
      - name: Scrape account12
        run: python scrape_main12.py
      - name: Validate account12 output
        run: |
          DATE=$(python scrape_target_date.py --account account12)
          OUT="data/account12/products_${DATE}.json"
          if [ -f "$OUT" ]; then
            python ensure_daily_scrape.py --validate-only --account account12 --date "$DATE"
          else
            echo "$OUT was not created"
            exit 1
          fi
      - name: Commit account12 output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(python scrape_target_date.py --account account12)
          git add "data/account12/products_${DATE}.json"
          git add "data/account12/scrape_summary_${DATE}.json" || true
          git add "data/account12/asin_history.json"
          git diff --staged --quiet || git commit -m "Auto-scrape account12 products ${DATE}"
          push_succeeded=false
          for i in 1 2 3; do
            if git push; then
              push_succeeded=true
              break
            fi
            echo "push failed (attempt $i)"
            if [ "$i" -lt 3 ]; then
              git pull --rebase origin main
              sleep 5
            fi
          done
          if [ "$push_succeeded" != "true" ]; then
            echo "git push failed after 3 attempts"
            exit 1
          fi

      - name: Preserve failure candidates
        if: ${{ failure() && env.PINEFIELD_TARGET_DATE != '' }}
        continue-on-error: true
        run: >-
          python ensure_daily_scrape.py --archive-failure --account account12
          --date "$PINEFIELD_TARGET_DATE"

      - name: Upload short-lived scrape diagnostics
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: scrape-account12-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pinefield-failures/
          retention-days: 3
          if-no-files-found: ignore
