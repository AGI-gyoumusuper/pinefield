name: Scrape Amazon Products (account8)

on:
  push:
    branches:
      - main
    paths:
      - ".github/triggers/account8.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape_account8:
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[scrape:account8]')) || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Scrape account8
        run: python scrape_main8.py

      - name: Validate account8 output
        run: python ensure_daily_scrape.py --validate-only --account account8

      - name: Commit account8 output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          git add "data/account8/products_${DATE}.json"
          git add "data/account8/scrape_summary_${DATE}.json" || true
          git add "data/account8/asin_history.json"
          git diff --staged --quiet || git commit -m "Auto-scrape account8 products ${DATE}"
          for i in 1 2 3; do
            git push && break
            echo "push failed (attempt $i), pulling --rebase and retrying..."
            git pull --rebase origin main
            sleep 5
          done
