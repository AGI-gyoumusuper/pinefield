name: Late Repair Daily Scrape Outputs

on:
  schedule:
    # JST 02:00. This is a late fallback after the regular and insurance windows.
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-scrape-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Repair missing or invalid outputs
        run: python ensure_daily_scrape.py

      - name: Commit repaired outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          for ACCOUNT in account1 account2 account3 account4 account5 account6 account7 account8 account9 account10 account11 account12 account13 account14 account15 account16 account17 account18 account19 account20; do
            git add "data/${ACCOUNT}/products_${DATE}.json" || true
            git add "data/${ACCOUNT}/scrape_summary_${DATE}.json" || true
            git add "data/${ACCOUNT}/asin_history.json" || true
          done
          git diff --staged --quiet || git commit -m "Auto-late-repair daily scrape outputs ${DATE}"
          push_succeeded=false
          for i in 1 2 3; do
            if git push; then
              push_succeeded=true
              break
            fi
            echo "push failed (attempt $i)"
            if [ "$i" -lt 3 ]; then
              git pull --rebase origin main
              sleep 5
            fi
          done
          if [ "$push_succeeded" != "true" ]; then
            echo "git push failed after 3 attempts"
            exit 1
          fi
