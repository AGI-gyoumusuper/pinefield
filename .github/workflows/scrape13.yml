name: Scrape Amazon Products (account13)

on:
  push:
    branches:
      - main
    paths:
      - ".github/triggers/account13.json"
  workflow_dispatch:
    inputs:
      diagnose_delivery_country:
        description: "Anonymous country-only diagnosis; no product scrape or Git writes"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  scrape_account13:
    if: ${{ ((github.event_name == 'push' && contains(github.event.head_commit.message, '[scrape:account13]')) || github.event_name == 'workflow_dispatch') && inputs.diagnose_delivery_country != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure failure diagnostics
        continue-on-error: true
        run: |
          echo "PINEFIELD_FAILURE_ARTIFACTS_DIR=$RUNNER_TEMP/pinefield-failures" >> "$GITHUB_ENV"
          echo "PINEFIELD_SEARCH_DIAGNOSTICS_DIR=$RUNNER_TEMP/pinefield-failures/public-search" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve target date
        if: ${{ inputs.diagnose_delivery_country != true }}
        run: |
          TARGET_DATE=$(python scrape_target_date.py --account account13)
          echo "PINEFIELD_TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"
      - name: Install scraper dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
      - name: Scrape account13
        if: ${{ inputs.diagnose_delivery_country != true }}
        run: python scrape_main13.py
      - name: Validate account13 output
        if: ${{ inputs.diagnose_delivery_country != true }}
        run: |
          DATE=$(python scrape_target_date.py --account account13)
          OUT="data/account13/products_${DATE}.json"
          if [ -f "$OUT" ]; then
            python ensure_daily_scrape.py --validate-only --account account13 --date "$DATE"
          else
            echo "$OUT was not created"
            exit 1
          fi
      - name: Commit account13 output
        if: ${{ inputs.diagnose_delivery_country != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(python scrape_target_date.py --account account13)
          git add "data/account13/products_${DATE}.json"
          git add "data/account13/scrape_summary_${DATE}.json" || true
          git add "data/account13/asin_history.json"
          git diff --staged --quiet || git commit -m "Auto-scrape account13 products ${DATE}"
          push_succeeded=false
          for i in 1 2 3; do
            if git push; then
              push_succeeded=true
              break
            fi
            echo "push failed (attempt $i)"
            if [ "$i" -lt 3 ]; then
              git pull --rebase origin main
              sleep 5
            fi
          done
          if [ "$push_succeeded" != "true" ]; then
            echo "git push failed after 3 attempts"
            exit 1
          fi

      - name: Preserve failure candidates
        if: ${{ failure() && env.PINEFIELD_TARGET_DATE != '' }}
        continue-on-error: true
        run: >-
          python ensure_daily_scrape.py --archive-failure --account account13
          --date "$PINEFIELD_TARGET_DATE"

      - name: Upload short-lived scrape diagnostics
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: scrape-account13-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pinefield-failures/
          retention-days: 3
          if-no-files-found: ignore

  diagnose_account13_delivery:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose_delivery_country == true }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install diagnostic dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
      - name: Diagnose account13 anonymous delivery country only
        timeout-minutes: 5
        run: python scripts/diagnose_account13_delivery.py --output-dir "${{ runner.temp }}/account13-delivery-diagnosis"
      - name: Upload account13 country-only diagnosis
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: account13-delivery-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/account13-delivery-diagnosis
          if-no-files-found: error
          retention-days: 3
