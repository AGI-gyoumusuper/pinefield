filters:
  selection_mode: "category_round_robin"
  rotation_state_file: "data/account11/category_rotation.json"
  min_price: 3000
  max_price: 0
  sort_order: "review_desc"
  max_total_items: 10
  max_per_category: 1
  exclude_title_patterns:
    - 'セット'
    - 'まとめ買い'
    - 'まとめ売り'
    - '詰め合わせ'
    - 'アソート'
    - '福袋'
    - '(?<!\d)×\s?[2-9](?!\d)'

exclusion:
  posted_asins_file: "data/account11/asin_history.json"
  exclude_within_days: 20
  exclude_scraped_candidates: false
  exclude_product_identifiers: true
  blocked_asins: []
