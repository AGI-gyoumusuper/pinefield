filters:
  selection_mode: "category_round_robin"
  rotation_state_file: "data/account19/category_rotation.json"
  min_price: 3000
  max_price: 0
  sort_order: "review_desc"
  max_total_items: 10
  max_per_category: 1
  exclude_title_patterns:
    - 'セット'
    - 'まとめ買い'
    - 'まとめ売り'
    - '詰め合わせ'
    - 'アソート'
    - '福袋'
