filters:
  selection_policy_version: "profit_price_desc_v1"
  require_sale_info: true
  discount_contract: "amazon_direct_discounts_v1"
  verify_detail_offer: true
  offer_scope: "unified_discounts"
  deferred_retry_failed_searches: true  # 検索失敗カテゴリ（部分取得を含む）を新しいブラウザ文脈で一度だけ遅延再巡回する。
  selection_mode: "global_ranked"  # 全カテゴリ横断で販売価格の高い順に採用
  rotation_state_file: "data/account17/category_rotation.json"  # 既存パスを保持。global_rankedでは未使用
  min_price: 8000        # 2026-10-16: 販売価格の下限。棚別の高い下限は維持
  max_price: 0           # 上限なし
  sort_order: "price_desc"  # 本人指定: 検証済候補を販売価格の高い順
  max_total_items: 10
  max_per_category: 0   # 棚別の優先枠を外し、価格順を維持
  exclude_title_patterns:
    - 'セット'
    - 'まとめ買い'
    - 'まとめ売り'
    - '詰め合わせ'
    - 'アソート'
    - '福袋'
    - '(?<!\d)×\s?[2-9](?!\d)'

exclusion:
  posted_asins_file: "data/account17/asin_history.json"
  exclude_within_days: 20
  exclude_scraped_candidates: false
  exclude_product_identifiers: true
  blocked_asins: []
